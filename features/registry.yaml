# Feature registry (Layer 3). One entry per feature; the /features catalog reads this file.
# Promise features share ONE definition (pipeline/macros/ptp_features.sql) evaluated as of the promise's creation
# for training (features.f_ptp_offline) and as of the scoring time for live use (features.f_ptp_online).
# built_by: sql | ai | voice. Text features are built_by: ai through the registered prompt "text_features" (provider: offline
# = our rule extractor validated on the release's public labels; an optional language model uses the same prompt).
# No voice acoustic or protected-attribute features are ever registered.
