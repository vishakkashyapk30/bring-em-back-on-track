# back-on-track.ai. Modular monolith: web + api long-running, jobs run-to-completion.
#
#   docker compose up --build    -> the whole system on http://localhost:8080
#     1. bootstrap: downloads the dataset into ./data/raw if it isn't there, builds the warehouse on the first run
#        (about 5 minutes), then exits; later runs find both and exit in seconds
#     2. api starts once bootstrap succeeds; web starts once the api is healthy
#   REBUILD=1 docker compose up --build   -> rebuild the warehouse from scratch
#   make nightly                          -> docker compose run --rm jobs nightly (manual rebuild)
name: collections360

x-python-env: &python-env
  env_file:
    - path: .env
      required: false

services:
  api:
    <<: *python-env
    build: {context: ., target: api}
    image: collections360/api:dev
    environment:
      USE_FIXTURES: ${USE_FIXTURES:-true}
      CORS_ORIGINS: http://localhost:8080
      # Optional language model for Ask (default offline = rules only). `ollama` reaches the Ollama running on the host.
      LLM_PROVIDER: ${LLM_PROVIDER:-offline}
      LLM_FALLBACK: ${LLM_FALLBACK:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST_FOR_DOCKER:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral:latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data                     # shared with local runs: one warehouse, no duplicate copy
      - ./data/raw:/app/data/raw:ro          # dataset is read-only for the api
      - c360-artefacts:/app/models/ptp_break/artefacts
      - ./reports:/app/reports
      - c360-models-cache:/app/.cache/models
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    restart: unless-stopped

  web:
    build: {context: ./web}
    image: collections360/web:dev
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  # Runs once per `docker compose up`: dataset + warehouse, then exits (see docker/bootstrap.sh).
  bootstrap:
    <<: *python-env
    build:
      context: .
      target: jobs
      args: {JOBS_EXTRAS: "${JOBS_EXTRAS:---extra pipeline}"}
    image: collections360/jobs:dev
    entrypoint: ["bootstrap"]
    environment:
      C360_DUCKDB_MEMORY: ${C360_DUCKDB_MEMORY:-8GB}
      REBUILD: ${REBUILD:-0}
    volumes:
      - ./data:/app/data                     # dataset is downloaded into ./data/raw if missing; warehouse built here
      - c360-artefacts:/app/models/ptp_break/artefacts
      - ./reports:/app/reports
      - c360-models-cache:/app/.cache/models

  jobs:
    <<: *python-env
    image: collections360/jobs:dev
    profiles: [jobs]
    environment:
      C360_DUCKDB_MEMORY: ${C360_DUCKDB_MEMORY:-8GB}
    volumes:
      - ./data:/app/data
      - c360-artefacts:/app/models/ptp_break/artefacts
      - ./reports:/app/reports
      - c360-models-cache:/app/.cache/models

  # Optional: event re-scoring / LLM backfill consumer. Only if inline re-scoring is too slow.
  worker:
    <<: *python-env
    image: collections360/jobs:dev
    profiles: [realtime]
    entrypoint: ["python", "-c", "raise SystemExit('worker not implemented: see docs/architecture/README.md')"]
    volumes:
      - ./data:/app/data

  # Optional: local LLM for LLM_PROVIDER=ollama (D13). Set OLLAMA_HOST=http://ollama:11434 in .env.
  ollama:
    image: ollama/ollama:latest
    profiles: [llm-local]
    volumes: [ollama-models:/root/.ollama]

volumes:
  c360-artefacts: {}
  c360-models-cache: {}
  ollama-models: {}
