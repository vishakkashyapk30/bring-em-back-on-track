[project]
name = "collections360"
version = "0.1.0"
description = "Back-on-Track.ai: helping customers get back on track, for the CIBC Collections Hackathon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pytz>=2024.1",  # duckdb needs it to return TIMESTAMPTZ values
    "jsonschema>=4.20",  # validates LLM/offline outputs against llm/schemas
    "pyarrow>=17",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "sqlglot>=25",
    "rapidfuzz>=3.9",
    "python-dotenv>=1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Layer 1: dbt transforms + Splink identity resolution
pipeline = ["dbt-duckdb>=1.8", "splink>=4.0", "huggingface_hub>=0.25"]
# Layer 4: PTP-break model
ml = ["lightgbm>=4.3", "scikit-learn>=1.5", "shap>=0.46"]
# Layer 2/assist: RAG (heavy, ~400 MB with onnxruntime + embedding model; install when disk allows)
rag = ["lancedb>=0.13", "fastembed>=0.4"]
# Optional LLM providers (D13: offline is the default and needs nothing)
llm = ["google-genai>=0.3"]
# Phase 2 overlap / uplift check only
causal = ["econml>=0.15"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "common", "identity", "semantic", "nlq", "rag", "features", "llm",
    "models", "decisioning", "governance", "api", "eval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "todo: constraint test for a module not implemented yet (skipped until the module lands)",
]
addopts = "-m 'not todo' -q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web", "data", "pipeline/target", "pipeline/dbt_packages", "docs/design", "docs/brief", "docs/data_dictionary", "docs/reviews"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# SQL-heavy modules: long query lines read better unwrapped
"governance/quality_report.py" = ["E501"]
"identity/run.py" = ["E501"]
"scripts/profile/profile_all.py" = ["E501"]
"api/services/c360.py" = ["E501"]
"api/services/analytics.py" = ["E501"]
"api/routers/calls.py" = ["E501"]
"api/routers/ask.py" = ["E501"]
"features/text_rules.py" = ["E501"]  # long regex alternations
"eval/run_benchmark.py" = ["E501"]
"nlq/pipeline.py" = ["E501"]
"nlq/refusal.py" = ["E501"]
"nlq/timeparse.py" = ["E501"]
"rag/answer.py" = ["E501"]
"rag/retrieve.py" = ["E501"]
"tests/unit/test_ask_offline.py" = ["E501"]
"semantic/registry.py" = ["E501"]
"semantic/compiler.py" = ["E501"]
# Independent spec suite (D18): kept exactly as written by the spec agent
"tests_spec/**" = ["E501", "B905"]
